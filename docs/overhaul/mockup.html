        --bg: #0b0910;
        --bar: #0b0910;
        --fg: #ece6f4;
        --dim: #aaa1b9;
        --faint: #746b86;
        --sel: #8d52e6;
        --norm: #2f283b;
        --win: #120e18;
        --win-2: #1b1623;
        --line: #2a2334;
        --purple: #c6a4ff;
        --green: #9bdca9;
        --yellow: #f0cd86;
        --red: #f48a93;
        --blue: #98b9f9;
        --cyan: #8fdede;
        --f-ui: "Ubuntu Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--purple); outline-offset: 1px; }
::selection { background: var(--sel); color: #fff; }
a { color: var(--blue); text-underline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--norm) transparent; }
pre { margin: 0; font: inherit; white-space: pre; }
.p { color: var(--purple); } .g { color: var(--green); } .y { color: var(--yellow); }
.r { color: var(--red); } .bl { color: var(--blue); } .c { color: var(--cyan); } .d { color: var(--dim); } .f { color: var(--faint); }
.b { font-weight: 700; }

.os { flex: 1; min-height: 620px; display: flex; flex-direction: column; position: relative; overflow: hidden; font: 16px/1.5 var(--f-ui); }

/* ---------------- bar ---------------- */
.dbar { display: flex; align-items: stretch; height: 28px; flex: none; background: var(--bar); font: 700 15px/28px var(--f-ui); white-space: nowrap; position: relative; z-index: 5; }
.tags { display: flex; }
.tag { position: relative; border: 0; background: transparent; padding: 0 9px; min-width: 28px; cursor: pointer; color: var(--dim); }
.tag.occ { color: var(--fg); padding-left: 13px; }
.tag.occ::before { content: ""; position: absolute; top: 4px; left: 4px; width: 5px; height: 5px; border: 1px solid currentColor; }
.tag.occ.has::before { background: currentColor; }
.tag.sel { background: var(--sel); color: #fff; }
.lt { border: 0; background: transparent; padding: 0 10px; cursor: pointer; color: var(--fg); }
.title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 0 12px; color: #fff; border: 0; text-align: left; cursor: pointer; }
.status { display: flex; align-items: stretch; padding-right: 10px; overflow: hidden; }
.status > * { padding: 0 2px; }
.sep { color: var(--faint); margin: 0 6px; }
.kbd { border: 0; background: transparent; cursor: pointer; color: var(--yellow); padding: 0 4px; }
.kbd:hover { background: var(--norm); }
.wx { cursor: help; }

/* ---------------- desktop + windows ---------------- */
.desk { flex: 1; position: relative; overflow: hidden; background: radial-gradient(ellipse at 78% 85%, rgba(141, 82, 230, 0.15), transparent 55%), #0a0810; }
.desk::after { content: ""; position: absolute; right: 5%; bottom: 6%; width: min(34vw, 380px); aspect-ratio: 1; background: rgba(198, 164, 255, 0.06); -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; pointer-events: none; }
.win { position: absolute; z-index: 1; display: flex; flex-direction: column; background: var(--win); border: 2px solid var(--norm); transition: left 0.16s ease, top 0.16s ease, width 0.16s ease, height 0.16s ease; }
.win.focus { border-color: var(--sel); }
.win[hidden] { display: none; }
.wbody { flex: 1; min-height: 0; overflow: auto; padding: 14px 18px; position: relative; }
.os.floating .win { transition: none; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55); }
.grip { display: none; position: absolute; top: 0; left: 0; right: 0; height: 14px; cursor: grab; z-index: 2; background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.12) 0 2px, transparent 2px 5px) center / 48px 3px no-repeat; }
.os.floating .grip { display: block; }
@media (prefers-reduced-motion: reduce) { .win { transition: none; } }

/* ---------------- zsh ---------------- */
.term { cursor: text; }
.term .out > div { white-space: pre-wrap; word-break: break-word; }
.term .out pre { white-space: pre; overflow-x: auto; }
.pl { display: flex; align-items: baseline; }
.ps { white-space: pre; }
.ed { position: relative; flex: 1; min-width: 0; }
.ed input { position: relative; z-index: 1; width: 100%; background: transparent; border: 0; padding: 0; outline: none; color: transparent; caret-color: var(--fg); }
.ed input::selection { color: transparent; background: rgba(141, 82, 230, 0.5); }
.ed .hl { position: absolute; inset: 0; white-space: pre; overflow: hidden; pointer-events: none; }
.ed .hl u { text-decoration-color: currentColor; text-underline-offset: 3px; }
.ghost { color: var(--faint); }
.eol { background: var(--fg); color: var(--win); font-weight: 700; }
.menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(26ch, 1fr)); gap: 0 14px; margin: 2px 0 4px; }
.menu span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
.menu span.on { background: var(--sel); color: #fff; }
.menu span.on .f { color: #e6d8ff; }
.menu .hd { grid-column: 1 / -1; color: var(--yellow); font-weight: 700; }
.neo { display: flex; flex-wrap: wrap; gap: 4px 26px; margin: 6px 0 4px; }
.neo pre { color: var(--purple); font-weight: 700; line-height: 1.25; }
.neo dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 0 10px; align-content: start; }
.neo dt { color: var(--purple); font-weight: 700; }
.neo dd { margin: 0; }
.neo .hd { grid-column: 1 / -1; }
.neo .pal { grid-column: 1 / -1; display: flex; margin-top: 8px; }
.neo .pal i { width: 26px; height: 16px; }
.sl-track { position: relative; height: 9.6em; overflow: hidden; }
.sl-track pre { position: absolute; left: 100%; color: var(--yellow); line-height: 1.15; animation: train 3.4s linear forwards; }
@keyframes train { to { transform: translateX(calc(-100% - 100vw)); } }

/* ---------------- htop ---------------- */
.htop .meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(19rem, 1fr)); gap: 2px 22px; margin-bottom: 10px; }
.htop .meter { display: flex; gap: 6px; white-space: nowrap; }
.htop .meter .lab { color: var(--cyan); width: 4ch; }
.htop .meter .bars { flex: 1; overflow: hidden; }
.htop .sum { color: var(--dim); margin-bottom: 8px; }
.htop table { border-collapse: collapse; width: 100%; }
.htop th { position: sticky; top: -14px; z-index: 1; background: var(--green); color: #0b0910; text-align: left; padding: 1px 8px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.htop th.on { background: var(--cyan); }
.htop td { padding: 2px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.htop tr.row { cursor: pointer; }
.htop tr.row:hover td, .htop tr.row:focus-visible td { background: var(--sel); color: #fff; }
.htop tr.row:focus-visible { outline: none; }
.keys { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--dim); }
.keys b { background: var(--cyan); color: #0b0910; padding: 0 3px; margin-right: 3px; }

/* ---------------- nvim ---------------- */
.pv { padding: 0 !important; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; overflow: hidden !important; }
.bufl { display: flex; overflow-x: auto; background: var(--win-2); border-bottom: 1px solid var(--line); }
.bufl button { border: 0; background: transparent; color: var(--dim); padding: 6px 14px; cursor: pointer; white-space: nowrap; border-right: 1px solid var(--line); }
.bufl button.on { background: var(--win); color: var(--fg); box-shadow: inset 0 2px 0 var(--purple); }
.bufl button .ic { margin-right: 6px; color: var(--purple); }
.bufl .sp { flex: 1; }
.pv-main { display: grid; grid-template-columns: minmax(0, 26ch) minmax(0, 1fr); min-height: 0; }
.pv.notree .pv-main { grid-template-columns: minmax(0, 1fr); }

/* ======================== helpers ======================== */
function el(tag, cls, text)
{
        const e = document.createElement(tag);
        if (cls)
                e.className = cls;
        if (text !== undefined)
                e.textContent = text;
        return e;
}

function esc(s)
{
        return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]; });
}

function store(k, v)
{
        try
        {
                if (v === undefined)
                        return localStorage.getItem(k);
                localStorage.setItem(k, v);
        }
        catch (e)
        {
                return null;
        }
}

function t(k, vars)
{
        let s = (T[S.lang] && T[S.lang][k]) || T.en[k] || k;
        if (vars)
                Object.keys(vars).forEach(function (v) { s = s.split("{" + v + "}").join(vars[v]); });
        return s;
}

function meta(repo)
{
        const m = META[repo] || {};
        return Object.assign({}, m, m[S.lang] || m.en || {});
}

function total(repo)
{
        return Object.values(REPO[repo].act).reduce(function (a, b) { return a + b; }, 0);
}

function nameOf(repo)
{
        return (META[repo] && META[repo].name) || repo;
}

function lev(a, b)
{
        const d = [];
        for (let i = 0; i <= a.length; i++)
        {
                d[i] = [i];
                for (let j = 1; j <= b.length; j++)
                {
                        d[i][j] = i === 0 ? j : Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
                        // adjacent transposition counts as one edit (gti → git)
                        if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1])
                                d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
                }
        }
        return d[a.length][b.length];
}

function activityChart(repo)

        const act = REPO[repo].act;

        MONTHS.forEach(function (m, i)

                const h = v ? Math.max(10, Math.round(Math.log(v + 1) / Math.log(max + 1) * 100)) : 3;
                bars += '<i class="' + (v ? "on" : "") + '" title="' + m + ": " + v + '" style="height:' + h + '%">' + (v === max ? "<b>" + v + "</b>" : "") + "</i>";
                labels += "<span>" + (i === 0 ? "'24" : m.endsWith("-01") ? "'" + m.slice(2, 4) : "") + "</span>";
        });
        return '<div class="chart" role="img" aria-label="' + esc(t("chart")) + '">' + bars + '</div><div class="chart-x">' + labels + "</div>";
}

// Mock tokenizer and cipher. The real site runs the C++ compiled to WebAssembly.
const VOCAB = ["token", "izer", "split", "review", "sub", "word", "the", "into", "great", "product", "would", "buy", "again", "s", "ing", "ed", "er", "in", "th", "re", "un", "on", "ize", "an", "at", "ly", "ag", "ain"];
function mockTokenize(text)
{
        const out = [];
        text.toLowerCase().replace(/[0-9\p{P}\p{S}]/gu, "").split(/\s+/).filter(Boolean).forEach(function (word, wi)
        {
                let i = 0;
                let first = true;
                while (i < word.length)
                {
                        let match = word[i];
                        for (const v of VOCAB)
                        {
                                if (word.startsWith(v, i) && v.length > match.length)
                                        match = v;
                        }
                        out.push((first && wi > 0 ? "▁" : "") + match);
                        first = false;
                        i += match.length;
                }
        });
        return out;
}

function mockBrutus(text, key)
{
        const cs = " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~";
        let out = "";
        for (let i = 0; i < text.length; i++)
        {
                const a = cs.indexOf(text[i]);
                const k = cs.indexOf(key[i % key.length]) + i * 7;
                out += a < 0 ? text[i] : cs[(a + k) % cs.length];
        }
        return out;
}

const KW =
{
        c: ["void", "bool", "int", "char", "const", "return", "if", "else", "for", "while", "struct", "static", "unsigned", "sizeof", "true", "false", "uint32_t", "uint64_t", "size_t"],
        cpp: ["void", "bool", "int", "char", "const", "return", "if", "else", "for", "while", "struct", "static", "unsigned", "auto", "double", "std", "string", "vector", "true", "false", "nullptr", "size_t", "continue"],
        py: ["def", "return", "if", "else", "elif", "for", "in", "not", "try", "except", "import", "from", "and", "or", "None", "True", "False"],
        php: ["class", "public", "protected", "private", "function", "return", "if", "else", "array", "string", "null", "new", "include"],
        mai: ["entry", "return", "none", "sint64", "sint32", "ascii"]
};

function highlight(code, lang)
{
        const kw = new Set(KW[lang] || []);
        const re = lang === "py" ? /(#.*$)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d[\w.]*\b)|([A-Za-z_]\w*)/g : /(\/\/.*$)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|(\b\d[\w.]*\b)|(\$?[A-Za-z_]\w*)/g;
        return code.split("\n").map(function (line)
        {
                if (lang !== "py" && /^\s*#/.test(line))
                        return '<span class="s-mac">' + esc(line) + "</span>";
                let out = "";
                let last = 0;
                let m;
                re.lastIndex = 0;
                while ((m = re.exec(line)) !== null)
                {
                        out += esc(line.slice(last, m.index));
                        let cls = "";
                        if (m[1])
                                cls = "s-com";
                        else if (m[2])
                                cls = "s-str";
                        else if (m[3])
                                cls = "s-num";
                        else if (kw.has(m[4]))
                                cls = "s-kw";
                        else if (/^\s*\(/.test(line.slice(re.lastIndex)))
                                cls = "s-fn";
                        else if (/_t$|^[A-Z][a-z]|^STATE_|^PQLDP_/.test(m[4]))
                                cls = "s-ty";
                        out += cls ? '<span class="' + cls + '">' + esc(m[0]) + "</span>" : esc(m[0]);
                        last = re.lastIndex;
                }
                return out + esc(line.slice(last));
        });
}

}

function kill(w)
{
        if (!w)
                return;
        if (w.onClose)
                w.onClose();
        w.node.remove();
        S.wins = S.wins.filter(function (x) { return x !== w; });
        if (S.focused[w.tag] === w)
                S.focused[w.tag] = S.wins.find(function (x) { return x.tag === w.tag; });
        view(S.tag);
}

function visible()
{
        return S.wins.filter(function (w) { return w.tag === S.tag; });
}

function focus(w)
{
        if (!w)
                return;
        S.focused[w.tag] = w;
        S.wins.forEach(function (x) { x.node.classList.toggle("focus", x === w); });
        arrange();
        if (w.onFocus)
                w.onFocus();
}

function view(tag)
{
        S.tag = tag;
        const vis = visible();
        if (!S.focused[tag] || S.focused[tag].tag !== tag)
                S.focused[tag] = vis[0];
        S.wins.forEach(function (x) { x.node.classList.toggle("focus", x === S.focused[tag]); });
        arrange();
        if (S.focused[tag] && S.focused[tag].onFocus)
                S.focused[tag].onFocus();
}

function place(w, x, y, ww, hh)
{
        const s = w.node.style;
        s.left = Math.round(x) + "px";
        s.top = Math.round(y) + "px";
        s.width = Math.max(160, Math.round(ww)) + "px";
        s.height = Math.max(110, Math.round(hh)) + "px";
}

function layoutOf(tag)
{
        return S.layouts[tag] || "tile";
}

function effLayout()
{
        const l = layoutOf(S.tag);
        return narrow() && l !== "float" ? "mono" : l;
}

function arrange()
{
        const vis = visible();
        const W = desk.clientWidth;
        const H = desk.clientHeight;
        const g = 6;
        const lay = effLayout();
        const f = S.focused[S.tag];
        os.classList.toggle("floating", lay === "float");
        S.wins.forEach(function (w) { w.node.hidden = w.tag !== S.tag; });
        if (lay === "mono")
        {
                vis.forEach(function (w)
                {
                        w.node.hidden = w !== f;
                        place(w, g, g, W - 2 * g, H - 2 * g);
                });
        }
        else if (lay === "tile")
        {
                const n = vis.length;
                const mw = n > 1 ? (W - 3 * g) * 0.58 : W - 2 * g;
                vis.forEach(function (w, i)
                {
                        if (i === 0)
                                place(w, g, g, mw, H - 2 * g);
                        else
                        {
                                const sh = (H - 2 * g - g * (n - 2)) / (n - 1);
                                place(w, 2 * g + mw, g + (i - 1) * (sh + g), W - 3 * g - mw, sh);
                        }
                });
        }
        else
        {
                vis.forEach(function (w, i)
                {
                        if (!w.fw)
                        {
                                w.fw = Math.min(760, W - 40);
                                w.fh = Math.min(460, H - 40);
                                w.fx = Math.max(10, Math.min(40 + i * 70, W - w.fw - 10));
                                w.fy = Math.max(10, Math.min(30 + i * 50, H - w.fh - 10));
                        }
                        place(w, w.fx, w.fy, w.fw, w.fh);
                });
        }
        vis.forEach(function (w) { w.node.style.zIndex = w === f ? 3 : 1; });
        renderBar();
}

function zoom()
{
        const f = S.focused[S.tag];
        if (!f)
                return;
        S.wins = [f].concat(S.wins.filter(function (w) { return w !== f; }));
        arrange();
}

function step(dir)
{
        const vis = visible();
        if (vis.length < 2)
                return;
        const i = vis.indexOf(S.focused[S.tag]);
        focus(vis[(i + dir + vis.length) % vis.length]);
}

function setLayout(l)
{
        S.layouts[S.tag] = l;
        arrange();
}

function cycleLayout()
{
        const order = ["tile", "mono", "float"];
        setLayout(order[(order.indexOf(layoutOf(S.tag)) + 1) % order.length]);
}

function dragStart(e, w)
{
        if (effLayout() !== "float" || e.button !== 0)
                return;
        e.preventDefault();
        const sx = e.clientX;
        const sy = e.clientY;
        const ox = w.fx;
        const oy = w.fy;
        const grip = e.currentTarget;
        grip.setPointerCapture(e.pointerId);
        focus(w);
        function move(ev)
        {
                w.fx = ox + ev.clientX - sx;
                w.fy = oy + ev.clientY - sy;
                place(w, w.fx, w.fy, w.fw, w.fh);
        }
        function up()
        {
                grip.removeEventListener("pointermove", move);
                grip.removeEventListener("pointerup", up);
        }
        grip.addEventListener("pointermove", move);
        grip.addEventListener("pointerup", up);
}

function openLauncher()
{
        closeLauncher();
        const all = FEATURED.map(function (r) { return [nameOf(r).toLowerCase(), function () { openProject(r); }]; }).concat([
                ["zsh", function () { spawnTerm(); }],
                ["htop", function () { openSingle("htop", 1); }],
                ["nvim", function () { openProject(null); }],
                ["f1ratings", function () { openSingle("f1", 3); }],
                ["firefox", function () { openSingle("ff", 9); }]
        ]).concat(Object.keys(REPO).filter(function (r) { return FEATURED.indexOf(r) === -1; }).map(function (r) { return [r, function () { openProject(r); }]; }));
        let sel = 0;
        const box = el("div", "dmenu");
        box.setAttribute("role", "dialog");
        box.setAttribute("aria-label", "dmenu");
        const inp = el("input");
        inp.id = "dmenu-in";
        inp.setAttribute("aria-label", "dmenu: type to filter, Enter to open");
        inp.autocomplete = "off";
        inp.spellcheck = false;
        const items = el("div", "items");
        box.append(inp, items);
        os.append(box);
        launcher = box;
        function matches()
        {
                const q = inp.value.toLowerCase();
                return all.filter(function (e) { return e[0].toLowerCase().indexOf(q) !== -1; });
        }
        function draw()
        {
                const m = matches();
                sel = Math.min(sel, Math.max(0, m.length - 1));
                items.replaceChildren.apply(items, m.map(function (e, i)
                {
                        const b = el("button", i === sel ? "sel" : "", e[0]);
                        b.type = "button";
                        b.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
                        b.addEventListener("click", function () { closeLauncher(); e[1](); });
                        return b;
                }));
        }
        inp.addEventListener("input", function () { sel = 0; draw(); });
        inp.addEventListener("keydown", function (e)
        {
                const m = matches();
                if (e.key === "Escape")
                        closeLauncher();
                else if (e.key === "Enter" && m[sel])
                {
                        closeLauncher();
                        m[sel][1]();
                }
                else if (e.key === "ArrowRight" || e.key === "ArrowDown" || (e.key === "Tab" && !e.shiftKey))
                {
                        sel = Math.min(m.length - 1, sel + 1);
                        draw();
                }
                else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || (e.key === "Tab" && e.shiftKey))
                {
                        sel = Math.max(0, sel - 1);
                        draw();
                }
                else
                        return;
                e.preventDefault();
        });
        inp.addEventListener("blur", function () { setTimeout(function () { if (launcher && document.activeElement !== inp) closeLauncher(); }, 120); });
        draw();
        inp.focus();
}

        const HIDDEN = new Set(["Hyprland", "hyprland", "win", "windows", "explorer.exe", "cmd.exe", "powershell", "regedit", "windows.exe", "winget", "choco", "scoop", "apt", "apt-get", "edge", "msedge", "wsl", "butterfly", "doctor", "M-x", "emacs", "nano", "bash", "chsh", "reboot", "shutdown", "poweroff", "systemctl"]);
        let emacsTries = 0;
        let busy = false;
        let mode = null;

        function notArch(c)
        {
                print("zsh: command not found: " + esc(c) + '\n<span class="f"># this is Arch. try pacman, or yay for the AUR.</span>', "r");
                return 127;
        }

        function butterfly()
        {
                ask(print("Do you really want to unleash the powers of the butterfly? (y or n) "), "yn", function (k)
                {
                        if (k !== "y")
                        {
                                print("Quit");
                                return;
                        }
                        busy = true;
                        print("Amazing physics going on...");
                        const art = el("pre", "p");
                        out.append(art);
                        const open = "   __     __\n  /  \\   /  \\\n  \\   \\ /   /\n   >   (   <\n  /   / \\   \\\n  \\__/   \\__/";
                        const shut = "      | |\n     /| |\\\n     \\| |/\n      ) (\n     /| |\\\n     \\| |/";
                        let n = 0;
                        const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
                        const tm = setInterval(function ()
                        {
                                art.textContent = n % 2 ? shut : open;
                                scroll();
                                if (++n > (reduce ? 1 : 9))
                                {
                                        clearInterval(tm);
                                        art.textContent = open;
                                        print("Successfully flipped one bit!", "g");
                                        busy = false;
                                        drawPrompt();
                                        scroll();
                                }
                        }, 260);
                });
        }

        const DOC =
        [
                [/\b(windows|microsoft)\b/i, ["Why do you say {0}? Have you considered Arch?", "Does {0} make you feel trapped?"]],
                [/\b(arch|linux|dwm)\b/i, ["I see you have good taste. Go on.", "And how does {0} make you feel?"]],
                [/\b(vim|nvim|neovim)\b/i, ["Is it because you could not exit {0} that you came to me?"]],
                [/\bemacs\b/i, ["We do not speak that name in this house."]],
                [/\bpython\b/i, ["Have you tried C++?"]],
                [/\bi am (.+)/i, ["Why do you say you are {1}?", "How long have you been {1}?"]],
                [/\bi feel (.+)/i, ["Do you often feel {1}?"]],
                [/\?$/, ["Why do you ask?", "What answer would please you most?"]]
        ];
        const DOC_DEFAULT = ["Can you elaborate on that?", "Why do you say that?", "I would appreciate it if you would continue.", "What makes you believe that?"];
        function doctor()
        {
                mode = "doctor";
                print("I am the psychotherapist.  Please, describe your problems.  Type bye to leave.", "p");
                return 0;
        }
        function doctorReply(line)
        {
                if (/^(bye|quit|exit|goodbye)\b/i.test(line))
                {
                        mode = null;
                        print("Goodbye. Try nvim, it helps.", "p");
                        return;
                }
                let reply = null;
                DOC.some(function (r)
                {
                        const m = line.match(r[0]);
                        if (!m)
                                return false;
                        const opts = r[1];
                        reply = opts[Math.floor(Math.random() * opts.length)].replace("{0}", m[0]).replace("{1}", (m[1] || "").replace(/[.!]+$/, ""));
                        return true;
                });
                print(esc(reply || DOC_DEFAULT[Math.floor(Math.random() * DOC_DEFAULT.length)]), "p");
        }

        function isCommand(word)
        {
                if (mode === "doctor")
                        return true;
                return !!(CMDS[word] || ALIASES[word] || (word.indexOf("!") === 0) || isDir(resolve(word)));
        }

        /* ----- line editor: syntax highlighting + autosuggestions ----- */
        function suggestion()
        {
                const v = inp.value;
                if (!v || inp.selectionStart !== v.length)
                        return "";
                for (let i = hist.length - 1; i >= 0; i--)
                {
                        if (hist[i].indexOf(v) === 0 && hist[i] !== v)
                                return hist[i].slice(v.length);
                }
                return "";
        }
        function paint()
        {
                const v = inp.value;
                let html = "";
                let first = true;
                v.split(/(\s+)/).forEach(function (p)
                {
                        if (!p || /^\s+$/.test(p))
                        {
                                html += esc(p);
                                return;
                        }
                        if (first)
                        {
                                first = false;
                                html += '<span class="' + (isCommand(p) ? "g" : "r") + '">' + esc(p) + "</span>";
                                return;
                        }
                        if (/^["']/.test(p))
                                html += '<span class="y">' + esc(p) + "</span>";
                        else if (p[0] !== "-" && (isDir(resolve(p)) || isFile(p)))
                                html += "<u>" + esc(p) + "</u>";
                        else
                                html += esc(p);
                });
                const sug = suggestion();
                if (sug)
                        html += '<span class="ghost">' + esc(sug) + "</span>";
                hl.innerHTML = html;
                hl.scrollLeft = inp.scrollLeft;
        }

        /* ----- completion (menu-select) ----- */
        function candidates(v)
        {
                const parts = v.split(" ");
                const word = parts[parts.length - 1];
                let pool;
                let head;
                if (parts.length === 1)
                {
                        head = "-- command --";
                        pool = Object.keys(CMDS).filter(function (k) { return k[0] !== ":" && !HIDDEN.has(k); }).map(function (k) { return [k, DESC[k] ? t(DESC[k]) : ""]; });
                }
                else if (/^(open|nvim|vim|vi)$/.test(parts[0]))
                {
                        head = "-- project --";
                        pool = FEATURED.map(function (r) { return [nameOf(r).toLowerCase(), meta(r).sub]; });
                }
                else if (parts[0] === "man")
                {
                        head = "-- manual page --";
                        pool = [["nox", t("h.man")]];
                }
                else if (parts[0] === "setxkbmap")
                {
                        head = "-- layout --";
                        pool = [["us", "English"], ["pl", "Polski"]];
                }
                else if (parts[0] === "git")
                {
                        head = "-- git command --";
                        pool = [["log", "show commit logs"], ["status", "show the working tree status"]];
                }
                else
                {
                        head = "-- file --";
                        const slash = word.lastIndexOf("/");
                        const dirPart = slash === -1 ? "" : word.slice(0, slash + 1);
                        const d = dirPart ? resolve(dirPart) : cwd;
                        pool = listDir(d).map(function (f) { return [dirPart + f, ""]; });
                }
                return { head: head, word: word, base: parts.slice(0, -1).join(" ") + (parts.length > 1 ? " " : ""), items: pool.filter(function (p) { return p[0].toLowerCase().indexOf(word.toLowerCase()) === 0; }) };
        }
        function drawMenu()
        {
                menuEl.replaceChildren(el("span", "hd", menu.head));
                menu.items.forEach(function (it, i)
                {
                        const s = el("span", i === menu.idx ? "on" : "");
                        s.innerHTML = esc(it[0]) + (it[1] ? '  <span class="f">-- ' + esc(it[1]) + "</span>" : "");
                        menuEl.append(s);
                });
                menuEl.hidden = false;
                scroll();
        }
        function closeMenu()
        {
                menu = null;
                menuEl.hidden = true;
        }
        function complete(back)
        {
                if (menu)
                {
                        menu.idx = (menu.idx + (back ? -1 : 1) + menu.items.length) % menu.items.length;
                        inp.value = menu.base + menu.items[menu.idx][0];
                        drawMenu();
                        paint();
                        return;
                }
                const c = candidates(inp.value);
                if (!c.items.length)
                        return;
                if (c.items.length === 1)
                {
                        const v = c.items[0][0];
                        inp.value = c.base + v + (v.endsWith("/") ? "" : " ");
                        paint();
                        return;
                }
                let pre = c.items[0][0];
                c.items.forEach(function (it)
                {
                        while (it[0].toLowerCase().indexOf(pre.toLowerCase()) !== 0)
                                pre = pre.slice(0, -1);
                });
                if (pre.length > c.word.length)
                        inp.value = c.base + pre;
                menu = { head: c.head, items: c.items, idx: -1, base: c.base };
                drawMenu();
                paint();
        }

        /* ----- running ----- */
        function run(line, nested)
        {
                let raw = line.trim();
                if (!nested)
                {
                        print(prompt() + esc(line));
                }
                if (raw === "!!")
                {
                        raw = hist[hist.length - 1] || "";
                        print(esc(raw));
                }
                if (!nested && raw)
                {
                        if (hist[hist.length - 1] !== raw)
                                hist.push(raw);
                        hi = hist.length;
                }
                if (!raw)
                {
                        drawPrompt();
                        return;
                }
                if (mode === "doctor")
                {
                        doctorReply(raw);
                        drawPrompt();
                        scroll();
                        return;
                }
                if (raw.replace(/\s/g, "").indexOf(":(){") === 0)
                {
                        print("zsh: fork bomb defused. ulimit -u says no.", "r");
                        status = 1;
                        drawPrompt();
                        scroll();
                        return;
                }
                if (/^(how (do i|to) )?(exit|quit|close) (n?vim|vi)\??$/i.test(raw))
                {
                        print(":q!  (you're welcome)", "y");
                        status = 0;
                        drawPrompt();
                        scroll();
                        return;
                }
                let parts = raw.split(/\s+/);
                if (ALIASES[parts[0]])
                        parts = ALIASES[parts[0]].split(" ").concat(parts.slice(1));
                const cmd = parts[0];
                const args = parts.slice(1);
                let code = 0;
                if (cmd === "c" || cmd === "c++isthebest")
                        print('<span class="y">C</span> <span class="f"># see noxsoftware.pl/' + esc(cmd) + "</span>");
                else if (CMDS[cmd])
                        code = CMDS[cmd](args) || 0;
                else if (!args.length && isDir(resolve(cmd)))
                        code = cd(cmd);
                else
                {
                        const known = Object.keys(CMDS).concat(Object.keys(ALIASES)).filter(function (k) { return k.length > 1 && k[0] !== ":"; });
                        let best = null;
                        let bd = 3;
                        known.forEach(function (k)
                        {
                                const d = lev(cmd.toLowerCase(), k.toLowerCase());
                                if (d < bd && d <= (cmd.length > 4 ? 2 : 1))
                                {
                                        bd = d;
                                        best = k;
                                }
                        });
                        if (best)
                        {
                                const fixed = [best].concat(args).join(" ");
                                ask(print("zsh: correct '" + '<span class="r">' + esc(cmd) + "</span>' to '" + '<span class="g">' + esc(best) + "</span>' [nyae]? "), "nyae", function (k)
                                {
                                        if (k === "y")
                                                run(fixed, true);
                                        else if (k === "e")
                                        {
                                                inp.value = fixed;
                                                paint();
                                        }
                                        else if (k === "n")
                                        {
                                                print("zsh: command not found: " + esc(cmd), "r");
                                                status = 127;
                                        }
                                });
                                return;
                        }
                        print("zsh: command not found: " + esc(cmd), "r");
                        code = 127;
                }
                status = code;
                if (!pending && !busy)
                        drawPrompt();
                else
                        ps.innerHTML = "";
                renderBar();
                scroll();
        }
        w.run = run;

        function ask(lineNode, keys, cb)
        {
                pending = { line: lineNode, keys: keys, cb: cb };
                ps.innerHTML = "";
                inp.value = "";
                paint();
                scroll();
        }

        function answer(k)
        {
                const p = pending;
                pending = null;
                p.line.append(k);
                p.cb(k);
                if (!pending && !busy)
                        drawPrompt();
                scroll();
        }

        inp.addEventListener("input", function ()
        {
                navPrefix = null;
                if (menu)
                        closeMenu();
                paint();
        });
        inp.addEventListener("keydown", function (e)
        {
                if (busy)
                {
                        e.preventDefault();
                        return;
                }
                if (pending)
                {
                        const k = e.key.toLowerCase();
                        if (pending.keys.indexOf(k) !== -1 && k.length === 1)
                                answer(k);
                        else if (e.key === "Enter")
                                answer("n");
                        e.preventDefault();
                        return;
                }
                if (e.key === "Tab")
                {
                        complete(e.shiftKey);
                        e.preventDefault();
                        return;
                }
                if (menu && e.key === "Enter")
                {
                        closeMenu();
                        paint();
                        e.preventDefault();
                        return;
                }
                if (menu && e.key !== "Shift")
                        closeMenu();
                if (e.key === "Enter")
                {
                        const v = inp.value;
                        inp.value = "";
                        navPrefix = null;
                        paint();
                        run(v);
                        e.preventDefault();
                }
                else if ((e.key === "ArrowRight" || e.key === "End") && inp.selectionStart === inp.value.length && suggestion())
                {
                        inp.value += suggestion();
                        paint();
                        e.preventDefault();
                }
                else if (e.key === "ArrowUp" || e.key === "ArrowDown")
                {
                        // history-substring-search
                        if (navPrefix === null)
                        {
                                navPrefix = inp.value;
                                hi = hist.length;
                        }
                        const dir = e.key === "ArrowUp" ? -1 : 1;
                        let i = hi + dir;
                        while (i >= 0 && i < hist.length && hist[i].indexOf(navPrefix) === -1)
                                i += dir;
                        if (i < 0)
                                i = hi;
                        hi = Math.min(i, hist.length);
                        inp.value = hi >= hist.length ? navPrefix : hist[hi];
                        paint();
                        e.preventDefault();
                }
                else if (e.key === "l" && e.ctrlKey)
                {
                        out.replaceChildren();
                        e.preventDefault();
                }
                else if (e.key === "u" && e.ctrlKey)
                {
                        inp.value = "";
                        paint();
                        e.preventDefault();
                }
                else if (e.key === "c" && e.ctrlKey && !window.getSelection().toString())
                {
                        print(prompt() + esc(inp.value) + "^C");
                        inp.value = "";
                        status = 130;
                        drawPrompt();
                        e.preventDefault();
                }
        });
        inp.addEventListener("keyup", paint);
        inp.addEventListener("scroll", function () { hl.scrollLeft = inp.scrollLeft; });
        body.addEventListener("mouseup", function ()
        {
                if (!window.getSelection().toString())
                        inp.focus({ preventScroll: true });
        });

        drawPrompt();
        if (!S.booted)
        {
                S.booted = true;
                print(prompt() + "neofetch");
                neofetch();
                w.welcome = print(t("welcome"), "d");
                w.onLang = function ()
                {
                        if (w.welcome && w.welcome.isConnected)
                                w.welcome.innerHTML = t("welcome");
                };
        }
};

/* ---------------- htop ---------------- */
RENDER.htop = function (body, w)
{
        body.classList.add("htop");
        w.title = function () { return "htop"; };
        let sortKey = "commits";
        const repos = Object.keys(REPO);
        const all = repos.reduce(function (a, r) { return a + total(r); }, 0);
        const recent = Date.parse("2026-10-01") - 30 * 86400000;
        const running = repos.filter(function (r) { return Date.parse(REPO[r].last) >= recent; }).length;
        const byLang = {};
        repos.forEach(function (r) { byLang[LANG[r]] = (byLang[LANG[r]] || 0) + total(r); });
        const meters = el("div", "meters");
        Object.entries(byLang).sort(function (a, b) { return b[1] - a[1]; }).slice(0, 4).forEach(function (e)
        {
                const pct = e[1] / all * 100;
                const m = el("div", "meter");
                m.innerHTML = '<span class="lab">' + esc(e[0]) + '</span><span class="f">[</span><span class="bars"><span class="g">' + "|".repeat(Math.round(pct / 100 * 32)) + "</span></span>" + '<span class="d">' + pct.toFixed(1) + '%</span><span class="f">]</span>';
                meters.append(m);
        });
        const sum = el("div", "sum");
        const table = el("table");
        const keys = el("div", "keys");
        body.append(meters, sum, table, keys);
        const COLS = [["PID", null], ["USER", null], ["S", null], ["CPU%", "commits"], ["TIME+", "commits"], ["LAST", "last"], ["Command", "name"]];
        function draw()
        {
                sum.innerHTML = t("htop.sum", { t: repos.length, r: running, c: all });
                keys.innerHTML = "<span><b>⏎</b>" + esc(t("htop.open")) + "</span><span><b>F6</b>" + esc(t("htop.sort")) + "</span><span><b>S</b>" + esc(t("htop.r")) + "</span><span><b>F10</b>" + esc(t("htop.close")) + "</span>";
                const rows = repos.slice().sort(function (a, b)
                {
                        if (sortKey === "last")
                                return REPO[b].last.localeCompare(REPO[a].last);
                        if (sortKey === "name")
                                return a.localeCompare(b);
                        return total(b) - total(a);
                });
                table.replaceChildren();
                const thead = el("thead");
                const tr = el("tr");
                COLS.forEach(function (c)
                {
                        const th = el("th", c[1] && c[1] === sortKey && c[0] !== "CPU%" ? "on" : "", c[0]);
                        if (c[1])
                                th.addEventListener("click", function () { sortKey = c[1]; draw(); });
                        tr.append(th);
                });
                thead.append(tr);
                const tb = el("tbody");
                rows.forEach(function (r)
                {
                        const run = Date.parse(REPO[r].last) >= recent;
                        const row = el("tr", "row");
                        row.tabIndex = 0;
                        row.innerHTML = "<td>" + (1000 + repos.indexOf(r) * 37) + '</td><td>nox</td><td class="' + (run ? "g b" : "f") + '">' + (run ? "R" : "S") + "</td><td>" + (total(r) / all * 100).toFixed(1) + "</td><td>" + total(r) + 'c</td><td class="d">' + REPO[r].last.slice(0, 7) + '</td><td class="' + (LANG[r] === "C" || LANG[r] === "C++" ? "p" : "") + '">./' + esc(r) + "</td>";
                        row.title = meta(r).sub || r;
                        row.addEventListener("click", function () { openProject(r); });
                        row.addEventListener("keydown", function (e) { if (e.key === "Enter") openProject(r); });
                        tb.append(row);
                });
                table.append(thead, tb);
        }
        draw();
        w.onLang = draw;
        body.addEventListener("keydown", function (e)
        {
                if (e.key === "F6")
                {
                        sortKey = sortKey === "commits" ? "last" : sortKey === "last" ? "name" : "commits";
                        draw();
                }
                else if (e.key === "F10" || e.key === "q")
                        kill(w);
                else if (e.key === "ArrowDown" || e.key === "ArrowUp")
                {
                        const rows = Array.from(table.querySelectorAll("tr.row"));
                        const i = rows.indexOf(document.activeElement);
                        const n = rows[Math.max(0, Math.min(rows.length - 1, i + (e.key === "ArrowDown" ? 1 : -1)))];
                        if (n)
                                n.focus();
                }
                else
                        return;
                e.preventDefault();
        });
};

/* ---------------- nvim: dashboard + project pages ---------------- */
RENDER.nvim = function (body, w)
{
        body.classList.add("pv", "notree");
        const bl = el("div", "bufl");

        const tree = el("nav", "tree");

        main.append(tree, buf);

        const cmdl = el("div", "cmdl");

        cmdl.append(cmd, msg);
        body.append(bl, main, stl, cmdl);
        let repo = null;
        let cur = "readme";
        let bufs = [];
        w.title = function ()
        {
                if (!repo)
                        return "nvim";
                const b = bufs.find(function (x) { return x[0] === cur; });

        function statusline(file, ft, pos)
        {
                stl.innerHTML = '<span class="mode">NORMAL</span>' + (repo ? '<span class="br"> master</span>' : "") + '<span class="fn">' + esc(file) + '</span><span class="d">' + esc(ft) + '</span><span class="d">utf-8</span><span class="pos">' + esc(pos) + "</span>";
        }

        function lines(rows, start, code)
        {
                buf.replaceChildren();
                rows.forEach(function (r, i)
                {
                        const ln = el("div", "ln" + (i === 0 ? " cur" : ""));
                        ln.append(el("span", "no", r[3] === false ? "" : String((start || 1) + i)));

                        if (r[2])
                                tx.innerHTML = r[0];
                        else
                                tx.textContent = r[0];
                        ln.append(tx);
                        buf.append(ln);
                });
                buf.scrollTop = 0;
        }

        function home()
        {
                repo = null;
                const t0 = performance.now();
                bl.replaceChildren();
                const tb = el("button", "on");
                tb.type = "button";
                tb.append(el("span", "ic", "◆"), document.createTextNode("dashboard"));
                bl.append(tb);
                body.classList.add("notree");
                buf.replaceChildren();
                const d = el("div", "dash");
                d.append(el("pre", "logo", ASCII.join("\n")), el("div", "tag-line", t("dash.tag")));
                const list = el("div", "list");
                list.append(el("h3", "", t("dash.projects")));
                FEATURED.forEach(function (r)
                {
                        const b = el("button", "item");
                        b.type = "button";
                        b.append(el("span", "k", KEYS[r]), el("span", "n", nameOf(r)), el("span", "s", meta(r).sub), el("span", "l", LANG[r]), el("span", "t", REPO[r].last.slice(0, 7)));
                        b.addEventListener("click", function () { open(r, "readme"); });
                        list.append(b);
                });
                const allb = el("button", "item");
                allb.type = "button";
                allb.append(el("span", "k", "a"), el("span", "n", t("dash.all")), el("span", "s", t("dash.allsub")), el("span", "l", ""), el("span", "t", ""));
                allb.addEventListener("click", function () { openSingle("htop", 1); });
                list.append(allb);
                d.append(list);
                const foot = el("div", "foot");
                d.append(foot);
                buf.append(d);
                foot.textContent = "⚡ " + t("dash.loaded", { n: Object.keys(REPO).length, ms: (performance.now() - t0).toFixed(2) });
                statusline("[dashboard]", "", "");
                cmd.placeholder = t("nv.ph").replace(":q back", ":q quit").replace(":q wstecz", ":q wyjdź");
                renderBar();
        }
        w.home = home;

        function tabs()
        {
                bl.replaceChildren();
                const back = el("button", "");
                back.type = "button";
                back.append(el("span", "ic", "◂"), document.createTextNode("dashboard"));
                back.addEventListener("click", home);
                bl.append(back);
                bufs.forEach(function (b)
                {
                        const x = el("button", b[0] === cur ? "on" : "");
                        x.type = "button";
                        x.append(el("span", "ic", b[2]), document.createTextNode(b[1]));
                        x.addEventListener("click", function () { show(b[0]); });
                        bl.append(x);
                });
                bl.append(el("span", "sp"));

        w.onLang = function ()
        {
                if (repo)
                {
                        cmd.placeholder = t("nv.ph");
                        show(cur);
                }
                else
                        home();
        };

        cmd.addEventListener("keydown", function (e)
        {
                if (e.key === "Escape")
                {
                        cmd.value = "";
                        buf.focus();
                        return;
                }
                if (e.key !== "Enter")
                        return;
                const v = cmd.value.trim().replace(/^:/, "");
                cmd.value = "";
                msg.className = "ok";
                msg.textContent = "";
                if (/^(q|q!|wq|x|bd)$/.test(v))
                {
                        if (repo)
                                home();
                        else
                                kill(w);
                        return;
                }
                if (/^qa!?$/.test(v))
                {
                        kill(w);
                        return;
                }
                const m = v.match(/^e\s+(\S+)/);
                if (m)
                {
                        const r = findRepoGlobal(m[1]);
                        const b = bufs.find(function (x) { return x[0] === m[1] || x[1].toLowerCase() === m[1].toLowerCase(); });
                        if (b)
                                show(b[0]);
                        else if (r)
                                open(r, "readme");
                        else
                        {
                                msg.className = "msg";
                                msg.textContent = "E32: No file name";
                        }
                        return;
                }
                const lg = v.match(/^lang(?:uage)?\s+(\w\w)/);
                if (lg && (lg[1] === "pl" || lg[1] === "en"))
                {
                        setLang(lg[1]);
                        return;
                }
                if (/^(Dashboard|Alpha)$/.test(v))
                {
                        home();
                        return;
                }
                if (v === "help")
                {
                        msg.textContent = ":q · :e readme|code|log|demo|<project> · :Neotree · :lang pl|en";
                        return;
                }
                if (/^Neotree/.test(v) && repo)
                {
                        body.classList.toggle("notree");
                        tabs();
                        return;
                }
                if (v === "w")
                {
                        msg.className = "msg";
                        msg.textContent = "E45: 'readonly' option is set (add ! to override)";
                        return;
                }
                if (v)
                {
                        msg.className = "msg";
                        msg.textContent = "E492: Not an editor command: " + v;
                }
        });
        body.addEventListener("keydown", function (e)
        {
                if (e.target === cmd || e.target.tagName === "INPUT" || e.altKey || e.ctrlKey || e.metaKey)
                        return;
                if (e.key === ":")
                {
                        cmd.focus();
                        e.preventDefault();
                        return;
                }
                if (!repo)
                {
                        const r = Object.keys(KEYS).find(function (k) { return KEYS[k] === e.key; });
                        if (r)
                                open(r, "readme");
                        else if (e.key === "a")
                                openSingle("htop", 1);
                        else if (e.key === "q")
                                kill(w);
                        return;
                }
                if (e.key === "j")
                        buf.scrollTop += 26;
                else if (e.key === "k")
                        buf.scrollTop -= 26;
                else if (e.key === "q")
                        home();
        });
        w.onFocus = function ()
        {
                if (!body.contains(document.activeElement))
                        buf.focus({ preventScroll: true });
        };
        home();
};

function findRepoGlobal(q)
{
        q = (q || "").toLowerCase();
        return Object.keys(REPO).find(function (r) { return r.toLowerCase() === q || nameOf(r).toLowerCase() === q; });
}

                a.target = "_blank";
                a.rel = "noopener";

        function renderSite(path)

                page.append(box);

                        box.append(ul, el("h2", "", pl ? "Kontakt" : "Contact"), el("p", "", "nox@noxsoftware.pl · github.com/NN0X"));

                        return "NoXsoftware";
                }
                const pm = path.match(/^\/(?:pl\/)?projects\/([^/]+)$/);

                {
                        const r = bySlug(pm[1]);

                                M.features.forEach(function (f) { ul.append(el("li", "", f)); });
                                box.append(ul);

                        box.append(el("h2", "", t("md.glance").replace("## ", "")));
                        box.append(el("p", "", t("f.lang") + ": " + LANG[r] + " · " + t("f.commits") + ": " + total(r) + " · " + t("f.last") + ": " + R.last + (M.license ? " · " + t("f.lic") + ": " + M.license : "")));
                        if (R.log[0])
                                box.append(el("p", "muted", t("md.latest") + ": " + R.log[0][0] + " " + R.log[0][2]));
                        const gh = el("a", "", "github.com/NN0X/" + r + " ↗");
                        gh.href = "https://github.com/NN0X/" + r;
                        gh.target = "_blank";
                        gh.rel = "noopener";
                        const open = el("button", "lnk", pl ? "Otwórz w nvim" : "Open in nvim");
                        open.type = "button";
                        open.addEventListener("click", function () { openProject(r); });
                        const row = el("p");
                        row.append(gh, document.createTextNode(" · "), open, document.createTextNode(" · "), link("← noxsoftware.pl", SITE));
                        box.append(row);
                        return (M.name || r) + " — NoXsoftware";
                }
                if (EGGS[egg])
                {
                        box.append(el("h1", "", EGGS[egg][0]));
                        const v = el("div", "vid");
                        v.innerHTML = "▶ " + esc(EGGS[egg][1]) + "<small>" + (pl ? "tu gra film ze starej strony (przekodowany, dużo mniejszy)" : "the video from the old site plays here (re-encoded, much smaller)") + "</small>";
                        box.append(v, link("← noxsoftware.pl", SITE));
                        return "NoXsoftware";
                }
                box.append(el("div", "big", "404"), el("p", "", pl ? "Nie znaleziono strony!" : "Page not found!"));
                const v = el("div", "vid");
                v.innerHTML = "¯\\_(ツ)_/¯<small>" + (pl ? "tu zostaje gif z Pulp Fiction" : "the confused Pulp Fiction gif stays here") + "</small>";
                box.append(v, link("← noxsoftware.pl", SITE));
                return "404 — NoXsoftware";
        }

        function draw()
        {
                const u = cur();
                const title = render(u);
                tabs[at].title = title;
                url.value = u === "about:newtab" ? "" : u.replace(/^https:\/\//, "").replace(/^about:search\?q=/, "");
                url.placeholder = t("ff.url");
                back.disabled = tabs[at].i === 0;
                fwd.disabled = tabs[at].i >= tabs[at].h.length - 1;
                strip.replaceChildren();
                tabs.forEach(function (tb, i)
                {
                        const b = el("button", "tab" + (i === at ? " on" : ""));
                        b.type = "button";
                        b.append(el("span", "", tb.title || t("ff.tab")));
                        const x = el("span", "tx", "×");
                        x.setAttribute("role", "button");
                        x.setAttribute("aria-label", "Close tab");
                        x.addEventListener("click", function (e)
                        {
                                e.stopPropagation();
                                tabs.splice(i, 1);
                                if (!tabs.length)
                                        tabs = [{ h: ["about:newtab"], i: 0 }];
                                at = Math.min(at, tabs.length - 1);
                                draw();
                        });
                        b.append(x);
                        b.addEventListener("click", function () { at = i; draw(); });
                        strip.append(b);
                });
                const nt = el("button", "newtab", "+");
                nt.type = "button";
                nt.setAttribute("aria-label", "New tab");
                nt.addEventListener("click", function ()
                {
                        tabs.push({ h: ["about:newtab"], i: 0 });
                        at = tabs.length - 1;
                        draw();
                        url.focus();
                });
                strip.append(nt);
                bm.replaceChildren();
                [["noxsoftware.pl", SITE], [t("dash.projects"), SITE + "/projects/sulla"], ["GitHub", "https://github.com/NN0X"], ["c++isthebest", SITE + "/c++isthebest"], ["about:robots", "about:robots"]].forEach(function (b)
                {
                        const x = el("button", "", b[0]);
                        x.type = "button";
                        x.addEventListener("click", function () { go(b[1]); });
                        bm.append(x);
                });
                page.scrollTop = 0;
                renderBar();
        }
        w.title = function () { return (tabs[at].title || t("ff.tab")) + " — Mozilla Firefox"; };
        w.onLang = draw;
        draw();
};

/* ======================== keys ======================== */
document.addEventListener("keydown", function (e)
{
        if (!e.altKey || e.ctrlKey || e.metaKey)
                return;
        const c = e.code;
        if (/^Digit[1-9]$/.test(c))
                view(Number(c.slice(5)));
        else if (c === "KeyJ")
                step(1);
        else if (c === "KeyK")
                step(-1);
        else if (c === "KeyP")
                openLauncher();
        else if (c === "Enter" && e.shiftKey)
                spawnTerm();
        else if (c === "Enter")
                zoom();
        else if (c === "KeyC" && e.shiftKey)
                kill(S.focused[S.tag]);
        else if (c === "KeyT")
                setLayout("tile");
        else if (c === "KeyM")
                setLayout("mono");
        else if (c === "KeyF")
                setLayout("float");
        else if (c === "Space")
                cycleLayout();
        else
                return;
        e.preventDefault();
});
